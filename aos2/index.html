  /* Jost: a free Futura-like face, for the screens that don't have Futura (iPhones do) */

<body>
<style>
  /* The aOS 2 teaser, in the Vintage design (mid-century modern): a 1080x1920 stage scaled to
     fit the phone, the ground drawn edge to edge behind it. It opens on walnut, like the earlier
     teasers open in the dark, and turns to cream when the apps find their one home. One look on
     purpose, so every colour is set here. */
  :root {
    --night: #241E1A;
    --cream: #F4ECDD;
    --card: #FBF5E9;
    --text: #2B2522;
    --mustard: #E3A72F;
    --teal: #1F6F6B;
    --orange: #D8572A;
    --edge: rgba(43,37,34,.14);
    --font: "Futura", "Futura-Medium", "Avenir Next", Jost, system-ui, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--night); color: var(--text); font-family: var(--font); overflow: hidden;
    -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
  .bar { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); transform: translateX(-50%);
    width: min(36vw, 160px); height: 3px; border-radius: 2px; background: rgba(140,120,100,.3); overflow: hidden; pointer-events: none; }
  .bar i { display: block; height: 100%; width: 100%; background: var(--mustard); transform-origin: 0 50%; transform: scaleX(0); }
  .pill { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 34px); transform: translateX(-50%);
    font: 600 15px/1 var(--font); letter-spacing: .02em; color: var(--text); background: var(--card);
    border: 0; box-shadow: inset 0 0 0 1.5px var(--edge); border-radius: 999px; padding: 12px 20px; cursor: pointer; }
  .pill:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
  .pill.big { bottom: auto; top: 50%; transform: translate(-50%, -50%); font-size: 19px; padding: 17px 30px;
    display: flex; align-items: center; gap: 10px; white-space: nowrap; background: var(--mustard); box-shadow: none; }
  .pill svg { width: 15px; height: 15px; }
  .snd { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); right: 14px; width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center; padding: 0; color: var(--text); background: var(--card); border: 0;
    box-shadow: inset 0 0 0 1.5px var(--edge); cursor: pointer; }
  .snd svg { width: 20px; height: 20px; }
  .snd:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
  .snd[hidden], .pill[hidden] { display: none; }
  .export .bar, .export .pill, .export .snd { display: none !important; }
</style>

<canvas id="film" role="img" aria-label="aOS 2 teaser. Fourteen apps, each alone on a walnut ground. Fourteen homes: a little roof drops onto each one. Then they gather, flying into one rounded aOS card, and one roof drops over them all. Every app, one home. A phone shows aOS's Home: Ipsy at the top, Open now, Favorites and the Family apps. Weather is tapped and slides in from the right, with the aOS pill in its corner: every app now opens inside aOS. A swipe from the left edge and it slides back to Home, where it waits in Open now. Ipsy, the little stem cell, grows big: ask Ipsy across all your apps. Do any orders arrive while we're away? Ipsy thinks, reaching Calendar, Notes, Meals, Orders, Travel and News, and answers: yes, one, on Tuesday, day 2 of your trip. aOS in your design: the aOS icon flips from Vintage to Sea glass and back. Then the mark: aOS, and a 2 drops in. The new aOS. Every app, one home. Open aOS to see it."></canvas>
<div class="bar" aria-hidden="true"><i id="progress"></i></div>
<button class="pill" id="pill" type="button" hidden>Replay</button>
<button class="snd" id="snd" type="button" aria-label="Mute" hidden></button>
<audio id="music" src="music.mp3" preload="auto" playsinline></audio>

<script>
(() => {
  'use strict';
  const EXPORT = /export/.test(location.search);
  if (EXPORT) document.documentElement.classList.add('export');
  const DUR = 38, W0 = 1080, H0 = 1920, CX = 540, TAU = Math.PI * 2, DEG = Math.PI / 180;
  const FAM = '"Futura", "Futura-Medium", "Avenir Next", Jost, system-ui, sans-serif';
  const cv = document.getElementById('film');
  let ctx = cv.getContext('2d');
  const spacing = px => { if ('letterSpacing' in ctx) ctx.letterSpacing = px; };
  const font = (w, s) => { ctx.font = `${w} ${s}px ${FAM}`; };

  // ---------- small maths ----------
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, u) => a + (b - a) * u;
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const ss = (t, a, b) => { const u = prog(t, a, b); return u * u * (3 - 2 * u); };
  const eo = u => 1 - Math.pow(1 - u, 3);
  const eio = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
  const eback = u => { const c1 = 1.56, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); };
  const ebounce = u => {
    const n = 7.5625, d = 2.75;
    if (u < 1 / d) return n * u * u;
    if (u < 2 / d) return n * (u -= 1.5 / d) * u + .75;
    if (u < 2.5 / d) return n * (u -= 2.25 / d) * u + .9375;
    return n * (u -= 2.625 / d) * u + .984375;
  };
  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const mix = (a, b, u) => a.map((v, i) => v + (b[i] - v) * u);
  const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  let seed = 2026;
  const rnd = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  // ---------- the Vintage colours (aOS/index.html, <style id="vintage">) ----------
  const NIGHT = hex('#241E1A'), CREAM = hex('#F4ECDD'), CARD = hex('#FBF5E9'), TEXT = hex('#2B2522'), MUTED = hex('#5B4A3F');
  const MUSTARD = hex('#E3A72F'), TEAL = hex('#1F6F6B'), TEAL_L = hex('#4FB3AB'), ORANGE = hex('#D8572A'), WALNUT = hex('#4A3426'), ON = hex('#FFF8EC');
  const EDGE = 'rgba(43,37,34,.14)';
  const GLASS_BG = hex('#EEF1F7'), GLASS = ['#A9D3C7', '#B9C6E0', '#E3C5C3', '#E9D6B4'].map(hex);

  // ---------- the apps (aOS/app.js names; each icon's Vintage colour) ----------
  const APPS = [
    ['mail', 'Mail', '#1F6F6B'], ['calendar', 'Calendar', '#3F6E9A'], ['clock', 'Clock', '#2B4257'], ['news', 'News', '#7E8C34'],
    ['weather', 'Weather', '#4F9AB0'], ['notes', 'Notes', '#55606B'], ['podcasts', 'Podcasts', '#7A4A8C'], ['travel', 'Travel', '#4B4FA3'],
    ['places', 'Places', '#3E8E5A'], ['fitness', 'Fitness', '#4A3426'], ['drinks', 'Drinks', '#A8456E'], ['meals', 'Meals', '#8E3A2B'],
    ['orders', 'Orders', '#D8572A'], ['house', 'Home', '#E3A72F'],
  ].map(([id, name, c]) => ({ id, name, hue: hex(c) }));
  const BY = Object.fromEntries(APPS.map(a => [a.id, a]));
  const NAPPS = APPS.length;   // fourteen

  // ======================================================================
  // The film's clock (make-video/music.py keeps the same numbers)
  // ======================================================================
  const POP = APPS.map((_, k) => .6 + k * .15);          // each app appears, alone
  const ROOF = APPS.map((_, k) => 4.6 + k * .08);        // a roof for each: fourteen homes
  const ROOF_OFF = 8.0;                                  // the roofs lift away
  const CARD_IN = 8.3;                                   // one home card
  const FLY = APPS.map((_, k) => 8.6 + k * .07), FLIGHT = .75;
  const BIG_ROOF = 10.35, BIG_ROOF_LAND = 10.6;          // one roof over them all
  const WIPE0 = 10.4, WIPE1 = 11.15;                     // walnut turns to cream
  const MORPH0 = 13.2, MORPH1 = 14.1;                    // the card becomes the phone's screen
  const TAP = 15.4, OPEN0 = 15.5, OPEN1 = 16.1;          // Weather opens inside aOS
  const SWIPE0 = 17.2, SWIPE1 = 17.8;                    // a swipe from the left edge: back to Home
  const ONOW = 18.0;                                     // Weather waits in Open now
  const IPSY0 = 20.6, IPSY1 = 21.4;                      // into Ipsy
  const ASK = 22.3, THINK0 = 23.2, THINK1 = 25.5, ANSWER = 25.7, IPSY_OUT = 27.9;
  const DESIGN0 = 28.4, FLIP1 = 29.4, FLIP2 = 30.4, DESIGN1 = 31.1;
  const MARK0 = 31.3, TWO = 32.0, TWO_LAND = 32.0 + .7 / 2.75, END0 = 34.6;

  // ---------- stage ----------
  let DPR = 1, CW = W0, CH = H0, S = 1, OX = 0, OY = 0, L = 0, R = W0, TOP = 0, B = H0;
  function resize() {
    DPR = EXPORT ? 1 : Math.min(window.devicePixelRatio || 1, 2);
    CW = window.innerWidth; CH = window.innerHeight;
    cv.width = Math.round(CW * DPR); cv.height = Math.round(CH * DPR);
    S = Math.min(CW / W0, CH / H0); OX = (CW - W0 * S) / 2; OY = (CH - H0 * S) / 2;
    L = -OX / S; R = W0 + OX / S; TOP = -OY / S; B = H0 + OY / S;
  }
  function rrPath(x, y, w, h, r, c = ctx) {
    const [a, b, d, e] = Array.isArray(r) ? r : [r, r, r, r];
    const m = v => Math.max(0, Math.min(v, w / 2, h / 2));
    const ra = m(a), rb = m(b), rd = m(d), re = m(e);   // top-left, top-right, bottom-right, bottom-left
    c.moveTo(x + ra, y); c.lineTo(x + w - rb, y); c.arcTo(x + w, y, x + w, y + rb, rb);
    c.lineTo(x + w, y + h - rd); c.arcTo(x + w, y + h, x + w - rd, y + h, rd); c.lineTo(x + re, y + h);
    c.arcTo(x, y + h, x, y + h - re, re); c.lineTo(x, y + ra); c.arcTo(x, y, x + ra, y, ra); c.closePath();
  }
  const rr = (x, y, w, h, r) => { ctx.beginPath(); rrPath(x, y, w, h, r); };
  const disc = (x, y, r, fill) => { if (r <= 0) return; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = fill; ctx.fill(); };
  function pillBar(x, y, w, h, rot, fill) {     // the rotated pill of the atomic shapes
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); rr(-w / 2, -h / 2, w, h, h / 2); ctx.fillStyle = fill; ctx.fill(); ctx.restore();
  }
  // the three little bars under every title: teal 28, mustard 14, an orange dot (6 high)
  function bars(x, y, k, a = 1, grow = 1) {
    if (a <= 0 || grow <= 0) return;
    const ga = ctx.globalAlpha; ctx.globalAlpha = ga * a;
    [[0, 28, TEAL], [34, 14, MUSTARD], [54, 8, ORANGE]].forEach(([dx, w, c], i) => {
      const g = clamp(grow * 3 - i * .9);
      if (g <= 0) return;
      rr(x + dx * k, y, Math.max(6 * k, w * k * eo(g)), 6 * k, 3 * k); ctx.fillStyle = rgba(c); ctx.fill();
    });
    ctx.globalAlpha = ga;
  }
  // a line of text, shrunk to fit
  function fit(text, w, size, max) {
    font(w, size); const m = ctx.measureText(text).width;
    if (m > max) { size = Math.floor(size * max / m); font(w, size); }
    return size;
  }

  // ---------- the icons, masked once ----------
  const ICON = {};
  function loadIcons() {
    const one = (id, hue, file) => new Promise(done => {
      const c = document.createElement('canvas'); c.width = c.height = 256;
      const g = c.getContext('2d'); g.beginPath(); rrPath(0, 0, 256, 256, 58, g); g.clip();
      g.fillStyle = rgba(hue); g.fillRect(0, 0, 256, 256); ICON[id] = c;
      const im = new Image();
      im.onload = () => { g.drawImage(im, 0, 0, 256, 256); done(); };
      im.onerror = () => done();
      im.src = `icons/${file || id}.webp`;
    });
    return Promise.all([...APPS.map(a => one(a.id, a.hue)), one('aos', TEAL), one('aos-glass', hex('#8193BC'))]);
  }
  function icon(id, x, y, s, a = 1, rot = 0) {
    if (a <= 0 || s <= 0) return;
    const ga = ctx.globalAlpha; ctx.globalAlpha = ga * Math.min(1, a);
    if (rot) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.drawImage(ICON[id], -s / 2, -s / 2, s, s); ctx.restore(); }
    else ctx.drawImage(ICON[id], x - s / 2, y - s / 2, s, s);
    ctx.globalAlpha = ga;
  }
  // a little roof: a flat triangle, softly rounded
  function roof(cx, baseY, w, h, col, a = 1) {
    if (a <= 0) return;
    const ga = ctx.globalAlpha; ctx.globalAlpha = ga * a;
    ctx.beginPath(); ctx.moveTo(cx - w / 2, baseY); ctx.lineTo(cx, baseY - h); ctx.lineTo(cx + w / 2, baseY); ctx.closePath();
    ctx.fillStyle = rgba(col); ctx.fill(); ctx.lineJoin = 'round'; ctx.lineWidth = w * .07; ctx.strokeStyle = rgba(col); ctx.stroke();
    ctx.globalAlpha = ga;
  }

  // ======================================================================
  // Ipsy: the stem cell (home/ipsy.js, its Vintage look), drawn in its own 200x200 box
  // ======================================================================
  const NI = 56;
  const G = (th, c, w) => { const d = Math.atan2(Math.sin(th - c), Math.cos(th - c)); return Math.exp(-((d / w) ** 2)); };
  const DEND = [-160, -115, -65, 150, 30], AMP = [34, 40, 36, 30, 62];
  const STEM = Array.from({ length: NI }, () => 55);
  const NEURON = Array.from({ length: NI }, (_, i) => { const th = i * TAU / NI; return 42 + DEND.reduce((s, a, j) => s + AMP[j] * G(th, a * DEG, j === 4 ? .14 : .17), 0); });
  const TIP = DEND.map(a => Math.round((((a * DEG) % TAU) + TAU) % TAU / (TAU / NI)) % NI);
  // ipsy: { x, y (where its middle goes), s (stage px per box unit), think 0..1, look [dx,dy], blink 0..1, talk 0..1, t }
  function drawIpsy(o) {
    const { x, y, s, think = 0, look = [0, 0], blink = 0, talk = 0, t = 0, a = 1 } = o;
    if (a <= 0 || s <= 0) return;
    ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.scale(s, s); ctx.translate(-100, -108);
    const bob = Math.sin(t * TAU / 2.8) * 3;
    ctx.beginPath(); ctx.ellipse(100, 186, 46 * (1 - bob / 30), 6, 0, 0, TAU); ctx.fillStyle = 'rgba(16,24,26,.13)'; ctx.fill();
    ctx.translate(0, bob - 2);
    // thinking: rings going out
    if (think > 0) for (let i = 0; i < 2; i++) {
      const u = ((t * .9 + i * .5) % 1);
      ctx.beginPath(); ctx.arc(100, 108, 70 + 60 * u, 0, TAU); ctx.lineWidth = 3; ctx.strokeStyle = rgba(TEAL, .6 * (1 - u) * think); ctx.stroke();
    }
    const wob = i => { const th = i * TAU / NI; return 1 + (.022 * Math.sin(t * 2.6 + 2 * th) + .012 * Math.sin(t * 1.9 - 3 * th)) * (1 - think); };
    const pts = STEM.map((r0, i) => { const r = lerp(r0, NEURON[i], think) * wob(i), th = i * TAU / NI; return [100 + r * Math.cos(th), 108 + r * Math.sin(th)]; });
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 0; i < NI; i++) {
      const p0 = pts[(i - 1 + NI) % NI], p1 = pts[i], p2 = pts[(i + 1) % NI], p3 = pts[(i + 2) % NI];
      ctx.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6, p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6, p2[0], p2[1]);
    }
    ctx.closePath(); ctx.fillStyle = rgba(mix(MUSTARD, TEAL, think)); ctx.fill();
    disc(128, 82, 13, rgba(TEXT, .12 * (1 - think)));
    // the sparks at its tips while it thinks
    if (think > .5) TIP.forEach((i, j) => { const on = Math.floor(t * 4 + j * .4) % 2; disc(pts[i][0], pts[i][1], 5, rgba(MUSTARD, on ? (think - .5) * 2 : .25)); });
    const face = mix(TEXT, CARD, think);
    ctx.save(); ctx.translate(look[0], look[1]);
    const ey = Math.max(.08, 1 - blink);
    [86, 114].forEach(ex => { ctx.beginPath(); ctx.ellipse(ex, 104, 6, 8.5 * ey, 0, 0, TAU); ctx.fillStyle = rgba(face); ctx.fill(); });
    ctx.restore();
    [72, 128].forEach(cx => { ctx.beginPath(); ctx.ellipse(cx, 120, 7, 4, 0, 0, TAU); ctx.fillStyle = rgba(mix(ORANGE, MUSTARD, think)); ctx.fill(); });
    if (talk > .02) { ctx.beginPath(); ctx.ellipse(100, 123, 6, 1 + 4 * talk, 0, 0, TAU); ctx.fillStyle = rgba(face); ctx.fill(); }
    else { ctx.beginPath(); ctx.moveTo(93, 120); ctx.quadraticCurveTo(100, 127, 107, 120); ctx.lineWidth = 3.2; ctx.lineCap = 'round'; ctx.strokeStyle = rgba(face); ctx.stroke(); }
    ctx.restore();
  }

  // ======================================================================
  // The ground: walnut, then cream from the one home outward
  // ======================================================================
  const HOME_C = [540, 980];
  function drawGround(t) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const glass = ss(t, FLIP1, FLIP1 + .3) * (1 - ss(t, FLIP2, FLIP2 + .3));
    ctx.fillStyle = rgba(t < WIPE1 ? NIGHT : mix(CREAM, GLASS_BG, glass)); ctx.fillRect(0, 0, CW, CH);
    ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, DPR * OY);
    if (t >= WIPE0 && t < WIPE1) disc(HOME_C[0], HOME_C[1], 2400 * eio(prog(t, WIPE0, WIPE1)), rgba(CREAM));
    if (glass > 0) {          // Sea glass: its soft colours drift in
      GLASS.forEach((c, i) => {
        const x = [L + 60, R - 80, L + 160, R - 120][i], y = [TOP + 300, TOP + 700, B - 520, B - 220][i];
        const g = ctx.createRadialGradient(x, y, 0, x, y, 620);
        g.addColorStop(0, rgba(c, .85 * glass)); g.addColorStop(1, rgba(c, 0));
        ctx.fillStyle = g; ctx.fillRect(x - 620, y - 620, 1240, 1240);
      });
    }
  }
  // the atomic shapes in the top right, like every Vintage title (scaled up for the stage)
  function drawAtoms(t) {
    const a = ss(t, .1, .9) * (1 - ss(t, CARD_IN - .1, CARD_IN + .4)); if (a <= 0) return;
    const k = 2.4, night = t < (WIPE0 + WIPE1) / 2 ? 1 : 0;
    const drift = 8 * Math.sin(t * .5);
    ctx.globalAlpha = a;
    disc(R - 96, TOP + 120 + drift, 264 * eback(prog(t, .1, .9)), rgba(MUSTARD));
    disc(R - 254, TOP + 312 - drift, 77 * eback(prog(t, .3, 1.1)), rgba(night ? TEAL_L : TEAL));
    const pu = eback(prog(t, .5, 1.3));
    pillBar(R - 192, TOP + 406, 288 * pu, 82 * pu, -18 * DEG, rgba(ORANGE));
    ctx.globalAlpha = 1;
  }

  // ======================================================================
  // 1-2. Fourteen apps, fourteen homes (0-8.3s), then one home (8.3-13.2s)
  // ======================================================================
  const SCAT = (() => {
    const rows = [[165, 415, 665, 915], [290, 540, 790], [165, 415, 665, 915], [290, 540, 790]], ys = [690, 930, 1170, 1410];
    const out = []; rows.forEach((xs, r) => xs.forEach(x => out.push([x + (rnd() - .5) * 50, ys[r] + (rnd() - .5) * 40, (rnd() - .5) * .16])));
    // shuffle which app sits where, so they don't read like a grid
    const order = [3, 9, 0, 12, 6, 1, 13, 4, 10, 7, 2, 11, 5, 8];
    return APPS.map((_, k) => out[order[k]]);
  })();
  const GRIDN = 4, GI = 128, GG = 44, CARD_W = GRIDN * GI + (GRIDN - 1) * GG + 116, CARD_R = 64;
  const CARD_RECT = [HOME_C[0] - CARD_W / 2, HOME_C[1] - CARD_W / 2, CARD_W, CARD_W];
  const GRID = APPS.map((_, k) => {
    const row = Math.floor(k / 4), col = row === 3 ? k - 12 + 1 : k % 4;
    return [CARD_RECT[0] + 58 + GI / 2 + col * (GI + GG), CARD_RECT[1] + 58 + GI / 2 + row * (GI + GG)];
  });
  const ROOF_COL = [MUSTARD, ORANGE, CREAM, TEAL_L];
  function drawLoneApps(t) {
    if (t > MORPH0 + .5) return;
    for (let k = 0; k < NAPPS; k++) {
      const pop = prog(t, POP[k], POP[k] + .45); if (pop <= 0) continue;
      const [sx, sy, srot] = SCAT[k], [gx, gy] = GRID[k];
      const f = eio(prog(t, FLY[k], FLY[k] + FLIGHT));
      const bob = 7 * Math.sin(t * 1.7 + k * 1.3) * (1 - f);
      const arc = Math.sin(Math.PI * f) * 90 * (k % 2 ? 1 : -1);
      const x = lerp(sx, gx, f) + arc * .4, y = lerp(sy, gy, f) - Math.abs(arc) + bob;

    if (!glass) { rr(-s / 2 + 14, -s / 2 + 22, s, s, s * .227); ctx.fillStyle = 'rgba(43,37,34,.12)'; ctx.fill(); }
    else { ctx.shadowColor = 'rgba(64,62,100,.25)'; ctx.shadowBlur = 60; ctx.shadowOffsetY = 24; }
    icon(glass ? 'aos-glass' : 'aos', 0, 0, s, ss(iu, 0, .3));
    ctx.restore();
    // the switch: Vintage | Sea glass
    const sa = ss(t, DESIGN0 + .3, DESIGN0 + .6) * (1 - ss(t, DESIGN1 - .2, DESIGN1 + .1));
    if (sa > 0) {
      const w = 680, h = 116, x = CX - w / 2, y = 1240;
      const pos = eio(prog(t, FLIP1 - .2, FLIP1 + .15)) * (1 - eio(prog(t, FLIP2 - .2, FLIP2 + .15)));
      ctx.globalAlpha = sa;
      rr(x, y, w, h, h / 2); ctx.fillStyle = rgba(WALNUT); ctx.fill();
      rr(x + 8 + pos * (w / 2 - 8), y + 8, w / 2 - 8, h - 16, (h - 16) / 2); ctx.fillStyle = rgba(mix(MUSTARD, hex('#B9C6E0'), pos)); ctx.fill();
      font(600, 44); ctx.textAlign = 'center';
      ctx.fillStyle = rgba(mix(TEXT, CREAM, pos)); ctx.fillText('Vintage', x + w / 4 + 4, y + h / 2 + 15);
      ctx.fillStyle = rgba(mix(CREAM, TEXT, pos)); ctx.fillText('Sea glass', x + w * 3 / 4 - 4, y + h / 2 + 15);
      ctx.textAlign = 'left'; ctx.globalAlpha = 1;
    }
  }

  // ======================================================================
  // 6. The mark (31.3-34.6s) and the end card (34.6-38s)
  // ======================================================================
  const MK = { FS: 300, BY: 1000 };
  function drawMark(t) {
    if (t < MARK0) return;
    const end = eio(prog(t, END0, END0 + .7));
    const lift = -150 * end, msc = lerp(1, .86, end);
    // the shapes behind it
    ctx.globalAlpha = 1;
    disc(L + 40, 420 + lift * .5 + 10 * Math.sin(t * .6), 280 * eback(prog(t, MARK0, MARK0 + .6)), rgba(MUSTARD));
    disc(R - 130, 430 + lift * .5, 84 * eback(prog(t, MARK0 + .15, MARK0 + .7)), rgba(TEAL));
    const pu = eback(prog(t, MARK0 + .3, MARK0 + .9));
    pillBar(L + 230, 1560 - 10 * Math.sin(t * .6), 330 * pu, 92 * pu, -18 * DEG, rgba(ORANGE));
    // aOS
    const nu = prog(t, MARK0 + .1, MARK0 + .7), na = ss(nu, 0, .5);
    ctx.save(); ctx.translate(CX, MK.BY - 100); ctx.scale(msc, msc); ctx.translate(-CX, -(MK.BY - 100) + lift / msc);
    font(600, MK.FS); spacing(`${-.03 * MK.FS}px`); ctx.textAlign = 'left';
    const w = ctx.measureText('aOS').width, sup = 160, gap = 14, total = w + gap + sup * .56, x0 = CX - total / 2;
    ctx.globalAlpha = na; ctx.fillStyle = rgba(TEXT); ctx.fillText('aOS', x0, MK.BY + 60 * (1 - eo(nu)));
    spacing('0px');
    // the 2, dropping in
    const du = prog(t, TWO, TWO + .7);
    if (du > 0) {
      font(600, sup); ctx.fillStyle = rgba(ORANGE); ctx.globalAlpha = ss(du, 0, .1);
      ctx.fillText('2', x0 + w + gap, MK.BY - 150 - 700 * (1 - ebounce(du)));
    }
    ctx.globalAlpha = 1;
    // the three little bars, big
    bars(CX - 62 * 4.5 / 2, MK.BY + 70, 4.5, ss(t, TWO + .55, TWO + .7), prog(t, TWO + .55, TWO + 1.1));
    ctx.restore();
    // a burst of little shapes as the 2 lands
    const bu = prog(t, TWO_LAND, TWO_LAND + .9);
    if (bu > 0 && bu < 1) {
      const px = x0 + w + gap + sup * .28, py = MK.BY - 150 - sup * .35;
      for (let i = 0; i < 10; i++) {
        const an = -Math.PI / 2 + (i - 4.5) * .32, r = 60 + 220 * eo(bu);
        ctx.globalAlpha = 1 - bu; disc(px + Math.cos(an) * r, py + Math.sin(an) * r * .8, 10 * (1 - .5 * bu), rgba([MUSTARD, TEAL, ORANGE][i % 3])); ctx.globalAlpha = 1;
      }
    }
  }

  // ---------- the words ----------
  // each: shown from a to b, its lines at ys; *words* in the accent colour
  const WORDS = [
    { a: 1.25, b: 4.35, lines: ['Fourteen *apps.*'], y: [1650], night: 1 },
    { a: 4.75, b: 8.1, lines: ['Fourteen *homes.*'], y: [1650], night: 1 },
    { a: 10.85, b: 13.25, lines: ['Every app, *one home.*'], y: [1650], size: 96 },
    { a: 14.25, b: 17.35, lines: ['Every app now opens', 'inside *aOS.*'], y: [196, 292], size: 80 },
    { a: 17.65, b: 20.5, lines: ['Swipe back to Home.', 'Apps *stay put.*'], y: [196, 292], size: 80 },
    { a: 21.5, b: 27.95, lines: ['Ask *Ipsy*', 'across all your apps'], y: [196, 292], size: 80 },
    { a: 28.6, b: 31.05, lines: ['aOS in *your design*'], y: [300], size: 88 },
    { a: 32.75, b: 34.6, lines: ['The new *aOS*'], y: [1330], size: 96 },
    { a: 35.1, b: 99, lines: ['Every app, one home'], y: [1210], size: 84 },
  ];
  const segs = s => s.split(/(\*[^*]+\*)/).filter(Boolean).map(p => p[0] === '*' ? { t: p.slice(1, -1), p: 1 } : { t: p });
  function drawWords(t) {
    for (const bt of WORDS) {
      if (t < bt.a || t > bt.b) continue;
      let size = bt.size || 104;
      font(600, size); spacing((-.02 * size).toFixed(1) + 'px'); ctx.textAlign = 'left';
      const widest = Math.max(...bt.lines.map(l => ctx.measureText(l.replace(/\*/g, '')).width));
      if (widest > 940) { size = Math.floor(size * 940 / widest); font(600, size); spacing((-.02 * size).toFixed(1) + 'px'); }
      const ink = bt.night ? CREAM : TEXT, acc = bt.night ? MUSTARD : ORANGE;
      bt.lines.forEach((line, li) => {
        const tin = bt.a + li * .14, out = ss(t, bt.b - .35, bt.b);
        const al = ss(t, tin, tin + .5) * (1 - out); if (al <= 0) return;
        const dy = 30 * (1 - eo(prog(t, tin, tin + .7))) - 16 * out;
        const sg = segs(line), ws = sg.map(s => ctx.measureText(s.t).width);
        let x = CX - ws.reduce((a, b) => a + b, 0) / 2;
        ctx.globalAlpha = al;
        sg.forEach((s, i) => { ctx.fillStyle = rgba(s.p ? acc : ink); ctx.fillText(s.t, x, bt.y[li] + dy); x += ws[i]; });
        ctx.globalAlpha = 1;
      });
    }
    spacing('0px');
  }
  // the end card's last line, a teal pill
  function drawOpen(t) {
    const a = ss(t, 35.45, 35.85); if (a <= 0) return;
    const pu = eback(prog(t, 35.45, 36.0));
    const fs = fit('Open aOS to see it', 600, 54, 700), w = ctx.measureText('Open aOS to see it').width + 120, h = 124, y = 1320;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(CX, y + h / 2); ctx.scale(pu, pu); ctx.translate(-CX, -(y + h / 2));
    rr(CX - w / 2, y, w, h, h / 2); ctx.fillStyle = rgba(TEAL); ctx.fill();
    ctx.fillStyle = rgba(ON); ctx.textAlign = 'center'; ctx.fillText('Open aOS to see it', CX, y + h / 2 + fs * .35);
    ctx.restore(); ctx.textAlign = 'left';
  }

  // ---------- one frame ----------
  function render(t) {
    t = clamp(t, 0, DUR);
    ctx.globalAlpha = 1;
    drawGround(t);
    drawAtoms(t);
    drawPhoneGround(t);
    drawHomeCard(t);
    drawLoneApps(t);
    drawPhone(t);
    drawIpsyScene(t);
    if (t >= IPSY0 && t < IPSY_OUT + .6) drawIpsy(ipsyState(t));
    drawBubbles(t);
    drawDesign(t);
    drawMark(t);
    drawWords(t);
    drawOpen(t);
    document.body.style.background = rgba(t < WIPE1 ? NIGHT : CREAM);
  }

  // the link preview (1200x630), for make-video/render.mjs
  function renderOG(c) {
    const keep = ctx; ctx = c.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = rgba(CREAM); ctx.fillRect(0, 0, 1200, 630);
    disc(1190, 640, 230, rgba(MUSTARD)); disc(640, 70, 46, rgba(TEAL));
    pillBar(150, 585, 230, 62, -18 * DEG, rgba(ORANGE));
    // one home: a card of apps under one roof
    const cx = 920, cw = 400, chh = 280, cy = 250;
    roof(cx, cy - 14, 470, 120, MUSTARD);
    rr(cx - cw / 2, cy, cw, chh, 40); ctx.fillStyle = rgba(CARD); ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = EDGE; ctx.stroke();
    ['weather', 'notes', 'calendar', 'meals', 'orders', 'house'].forEach((id, i) => icon(id, cx - 120 + (i % 3) * 120, cy + 32 + 48 + Math.floor(i / 3) * 120, 96));
    font(600, 176); spacing('-5px'); ctx.textAlign = 'left'; ctx.fillStyle = rgba(TEXT);
    const w = ctx.measureText('aOS').width; ctx.fillText('aOS', 72, 250); spacing('0px');
    font(600, 94); ctx.fillStyle = rgba(ORANGE); ctx.fillText('2', 72 + w + 10, 158);
    bars(78, 286, 2.8);
    fit('Every app, one home', 600, 60, 560); spacing('-1px'); ctx.fillStyle = rgba(TEXT); ctx.fillText('Every app, one home', 72, 410); spacing('0px');
    fit('The new aOS. Open aOS to see it.', 500, 32, 560); ctx.fillStyle = rgba(MUTED); ctx.fillText('The new aOS. Open aOS to see it.', 74, 462);
    ctx = keep;
  }

  // ---------- playback: the film follows the music's clock while it plays ----------
  const bar = document.getElementById('progress'), pill = document.getElementById('pill');
  const snd = document.getElementById('snd'), music = document.getElementById('music');
  const PLAY_ICON = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9.5-5.5z" fill="currentColor"/></svg>';
  const SPEAKER = on => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/>${on ? '<path d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/>' : '<path d="M16 9.5l5 5M21 9.5l-5 5"/>'}</svg>`;
  let t0 = 0, held = 0, playing = false, raf = 0;
  const now = () => performance.now() / 1000;
  const setPill = mode => {
    pill.classList.toggle('big', mode === 'start');
    pill.innerHTML = mode === 'start' ? `${PLAY_ICON}<span>Play with sound</span>` : mode;
    pill.dataset.mode = mode; pill.hidden = false;
  };
  const paintSnd = () => { snd.innerHTML = SPEAKER(!music.muted); snd.setAttribute('aria-label', music.muted ? 'Sound on' : 'Mute'); };
  function tick() {
    // keep in step with the music; if it couldn't seek (or stalled), the film keeps its own time
    if (!music.paused && !music.ended && music.currentTime > 0 && Math.abs(now() - t0 - music.currentTime) < .75) t0 = now() - music.currentTime;
    const t = now() - t0;
    render(t); bar.style.transform = `scaleX(${clamp(t / DUR)})`;
    if (t >= DUR) { playing = false; held = DUR; music.pause(); setPill('Replay'); return; }
    raf = requestAnimationFrame(tick);
  }
  function play(from = 0) {
    cancelAnimationFrame(raf); t0 = now() - from; playing = true; pill.hidden = true;
    try { music.currentTime = from; const p = music.play(); if (p) p.catch(() => {}); } catch (e) { /* the film plays on without it */ }
    snd.hidden = false; paintSnd();
    raf = requestAnimationFrame(tick);
  }
  function pause() { if (!playing) return; cancelAnimationFrame(raf); held = now() - t0; playing = false; music.pause(); setPill('Play'); }
  pill.addEventListener('click', e => { e.stopPropagation(); play(pill.dataset.mode === 'Play' ? held : 0); });
  snd.addEventListener('click', e => { e.stopPropagation(); music.muted = !music.muted; paintSnd(); });
  cv.addEventListener('click', () => { if (playing) pause(); else if (pill.dataset.mode === 'Play') play(held); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('resize', () => { resize(); if (!playing) render(held); });

  async function start() {
    resize();
    try {
      await Promise.race([
        Promise.all([...['600 80px Jost', '500 40px Jost'].map(f => document.fonts.load(f, 'aOS Every app, one home 72°')), loadIcons()]),
        new Promise(r => setTimeout(r, 3000)),
      ]);
    } catch (e) { /* the system fonts and plain tiles still draw */ }
    if (EXPORT) { window.renderAt = render; window.renderOG = renderOG; render(0); window.__ready = true; return; }
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { held = DUR; render(DUR); setPill('Replay'); return; }
    render(0); setPill('start');   // sound needs a tap first
  }
  start();
})();
</script>
</body>
</html>
