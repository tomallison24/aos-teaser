<style>
  /* One continuous film, night to morning: a 1080x1920 stage scaled to fit the
     phone, with the sky drawn edge to edge behind it. Single look on purpose
     (it moves from dark to light itself), so every colour is set here. */
  :root {
    --night: #090B10;
    --ink-light: #F3F4F8;
    --ink-dark: #0B0B0F;
    --glass: rgba(255,255,255,.74);
    --edge: rgba(11,11,15,.08);
    --pastel: linear-gradient(100deg, #6FA597 0%, #8193BC 34%, #BE918F 67%, #BC9C68 100%);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--night); color: var(--ink-light); font-family: var(--font); overflow: hidden;
    -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
  .bar { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); transform: translateX(-50%);
    width: min(36vw, 160px); height: 2px; border-radius: 1px; background: rgba(140,140,150,.28); overflow: hidden; pointer-events: none; }
  .bar i { display: block; height: 100%; width: 100%; background: var(--pastel); transform-origin: 0 50%; transform: scaleX(0); }
  .pill { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 34px); transform: translateX(-50%);
    font: 600 15px/1 var(--font); letter-spacing: -.01em; color: var(--ink-dark); background: var(--glass);
    border: 1px solid var(--edge); border-radius: 999px; padding: 12px 20px;
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); cursor: pointer; }
  .pill:focus-visible { outline: 2px solid #8193BC; outline-offset: 3px; }
  .export .bar, .export .pill { display: none !important; }
</style>

<canvas id="film" role="img" aria-label="aOS1 teaser. Someone else decided what your apps can do. The aOS sparkle draws the stock apps into itself. Not anymore. An app is generated from a prompt. Built from the ground up. Shaped by you. Custom to you and your family's needs. AllisonOS customizes your apps so what matters most is front and center. No two are alike. Declare your independence. AllisonOS becomes aOS. Break free. Coming soon."></canvas>
<div class="bar" aria-hidden="true"><i id="progress"></i></div>
<button class="pill" id="pill" type="button" hidden>Replay</button>

<script>
(() => {
  'use strict';
  const EXPORT = /export/.test(location.search);
  if (EXPORT) document.documentElement.classList.add('export');
  const DUR = 45, W0 = 1080, H0 = 1920, CX = 540, TAU = Math.PI * 2;
  const FAM = '-apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, system-ui, sans-serif';
  const MONO = 'ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace';
  const cv = document.getElementById('film'), ctx = cv.getContext('2d');
  const HAS_LS = 'letterSpacing' in ctx;

  // ---------- small maths ----------
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, u) => a + (b - a) * u;
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const ss = (t, a, b) => { const u = prog(t, a, b); return u * u * (3 - 2 * u); };
  const eo = u => 1 - Math.pow(1 - u, 3);
  const eio = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
  const eback = u => { const c1 = 1.56, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); };
  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const mix = (a, b, u) => a.map((v, i) => v + (b[i] - v) * u);
  const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  let seed = 1776;
  const rnd = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  // ---------- Sea glass (from welcome.js): sea glass, mist, shell, sand ----------
  const DARK = ['#A9D3C7', '#B9C6E0', '#E3C5C3', '#E9D6B4'].map(hex);   // the pastel on dark
  const LIGHT = ['#6FA597', '#8193BC', '#BE918F', '#BC9C68'].map(hex);  // the pastel on light
  const INK_L = hex('#F3F4F8'), INK_D = hex('#0B0B0F');
  // colours follow the film's own clock (NOW), so a scene can run on a shifted clock and still match the sky
  let NOW = 0;
  const day = () => ss(NOW, 36.2, 37.9);
  const pal = i => mix(DARK[i], LIGHT[i], day());
  const tileCol = i => mix(mix(DARK[i], LIGHT[i], .4), LIGHT[i], day() * .6);   // deep enough for a white glyph
  const ink = () => mix(INK_L, INK_D, ss(NOW, 36.6, 37.3));
  const palAt = (u, t) => {
    const s = [0, .34, .67, 1]; let k = 0; while (k < 2 && u > s[k + 1]) k++;
    return mix(pal(k, t), pal(k + 1, t), clamp((u - s[k]) / (s[k + 1] - s[k])));
  };
  const pastel = (x0, x1, t) => {
    const g = ctx.createLinearGradient(x0, 0, x1, 0);
    [0, .34, .67, 1].forEach((s, i) => g.addColorStop(s, rgba(pal(i, t))));
    return g;
  };

  // The sky: night, a long blue hour, then morning.
  const SKY = [
    [0, '#090B10', '#0E1117'], [11, '#0C0F16', '#141925'], [20, '#141A2C', '#262D45'],
    [29, '#1F2742', '#4A4B67'], [35.8, '#27304F', '#6D6680'], [36.9, '#8090BC', '#DDB2A8'], [37.9, '#DCE3EF', '#F3E3D6'],
    [40.5, '#EEF1F6', '#F6EEE6'], [45, '#F2F4F8', '#F7F1EA'],
  ].map(([k, a, b]) => [k, hex(a), hex(b)]);
  const sky = t => {
    let i = 0; while (i < SKY.length - 2 && t > SKY[i + 1][0]) i++;
    const [k0, a0, b0] = SKY[i], [k1, a1, b1] = SKY[i + 1];
    const u = ss(t, k0, k1);
    return [mix(a0, a1, u), mix(b0, b1, u)];
  };

  // ---------- stage ----------
  let DPR = 1, CW = W0, CH = H0, S = 1, OX = 0, OY = 0, L = 0, R = W0, TOP = 0, B = H0;
  function resize() {
    DPR = EXPORT ? 1 : Math.min(window.devicePixelRatio || 1, 2);
    CW = window.innerWidth; CH = window.innerHeight;
    cv.width = Math.round(CW * DPR); cv.height = Math.round(CH * DPR);
    S = Math.min(CW / W0, CH / H0); OX = (CW - W0 * S) / 2; OY = (CH - H0 * S) / 2;
    L = -OX / S; R = W0 + OX / S; TOP = -OY / S; B = H0 + OY / S;
  }
  const SPRITES = new Map();
  function sprite(c) {
    const key = c.map(v => v | 0).join(',');
    if (SPRITES.has(key)) return SPRITES.get(key);
    const s = document.createElement('canvas'); s.width = s.height = 128;
    const g = s.getContext('2d'), r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    r.addColorStop(0, rgba(c, 1)); r.addColorStop(.35, rgba(c, .45)); r.addColorStop(1, rgba(c, 0));
    g.fillStyle = r; g.fillRect(0, 0, 128, 128);
    if (SPRITES.size > 400) SPRITES.clear();
    SPRITES.set(key, s); return s;
  }
  const quant = c => c.map(v => Math.round(v / 6) * 6);
  function glow(x, y, r, c, a) {
    if (a <= .002 || r <= 0) return;
    const ga = ctx.globalAlpha; ctx.globalAlpha = ga * a; ctx.drawImage(sprite(quant(c)), x - r, y - r, r * 2, r * 2); ctx.globalAlpha = ga;
  }
  function rrPath(x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  }
  const rr = (x, y, w, h, r) => { ctx.beginPath(); rrPath(x, y, w, h, r); };
  function star4(x, y, r, fill) {
    ctx.beginPath();
    for (let i = 0; i < 8; i++) { const a = -Math.PI / 2 + i * Math.PI / 4, q = i % 2 ? r * .3 : r; ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); }
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
  }

  // ---------- mist ----------
  const MIST = Array.from({ length: 6 }, () => ({ x: rnd() * W0, y: 260 + rnd() * 1300, r: 380 + rnd() * 420, v: (rnd() - .5) * 26, a: .045 + rnd() * .05 }));
  function drawMist(t) {
    const env = ss(t, 0, 2.5) * (1 - ss(t, 19, 25));
    if (env > 0) for (const m of MIST) glow(m.x + m.v * t, m.y, m.r, DARK[1], m.a * env);
  }

  // ---------- 1. a stock phone ----------
  const PH = { cx: 540, cy: 800, w: 560, h: 1140, r: 84 }, IN = 16;
  const SX = PH.cx - PH.w / 2 + IN, SY = PH.cy - PH.h / 2 + IN, SW = PH.w - IN * 2, SHT = PH.h - IN * 2;
  const IS = 96, PIV = [540, 734], TGT = [540, 820], IMPACT = TGT, GROUND = 1300;
  const zoomU = t => eio(prog(t, 5.0, 6.5));
  const Zf = t => lerp(1, 2.1, zoomU(t));
  const toScreen = (x, y, t) => { const Z = Zf(t), u = zoomU(t); return [(x - PIV[0]) * Z + PIV[0] + (TGT[0] - PIV[0]) * u, (y - PIV[1]) * Z + PIV[1] + (TGT[1] - PIV[1]) * u]; };
  const GRIDG = ['mail', 'calendar', 'photo', 'camera', 'clock', 'pin', 'music', 'chat', 'play', 'book', 'bag', 'compass', 'search', 'bell', 'chart', 'lock', 'gear', 'phone', 'clock', 'photo'];
  const ICONS = [];
  const gap = (SW - 4 * IS) / 5;
  GRIDG.forEach((g, i) => { const c = i % 4, r = (i / 4) | 0; ICONS.push({ g, x: SX + gap + c * (IS + gap) + IS / 2, y: SY + 168 + r * 160, label: 40 + rnd() * 26 }); });
  ['phone', 'chat', 'compass', 'music'].forEach((g, c) => ICONS.push({ g, x: SX + gap + c * (IS + gap) + IS / 2, y: SY + SHT - 80, dock: true }));
  ICONS.forEach((k, i) => {
    k.i = i; k.sp = toScreen(k.x, k.y, 7);
    k.ts = 7.1 + Math.min(1, Math.hypot(k.sp[0] - IMPACT[0], k.sp[1] - IMPACT[1]) / 1100) * 1.1 + (i % 3) * .05;   // drawn in, nearest first
  });

  function stock(name) {                 // generic stock-app symbols, about 44px across
    const c = ctx; c.beginPath();
    switch (name) {
      case 'mail': c.rect(-20, -14, 40, 28); c.moveTo(-20, -14); c.lineTo(0, 3); c.lineTo(20, -14); break;
      case 'camera': rrPath(-21, -12, 42, 29, 6); c.moveTo(8, 3); c.arc(0, 3, 8, 0, TAU); c.moveTo(-8, -12); c.lineTo(-5, -18); c.lineTo(5, -18); c.lineTo(8, -12); break;
      case 'calendar': rrPath(-19, -16, 38, 35, 6); c.moveTo(-19, -6); c.lineTo(19, -6); c.moveTo(-9, -22); c.lineTo(-9, -12); c.moveTo(9, -22); c.lineTo(9, -12); break;
      case 'clock': c.arc(0, 0, 19, 0, TAU); c.moveTo(0, 0); c.lineTo(0, -11); c.moveTo(0, 0); c.lineTo(8, 5); break;
      case 'pin': c.moveTo(0, 21); c.bezierCurveTo(-8, 10, -17, 2, -17, -6); c.arc(0, -6, 17, Math.PI, 0); c.bezierCurveTo(17, 2, 8, 10, 0, 21); c.moveTo(6, -6); c.arc(0, -6, 6, 0, TAU); break;
      case 'music': c.moveTo(-6, 13); c.lineTo(-6, -16); c.lineTo(14, -20); c.lineTo(14, 9); c.moveTo(-6, 13); c.arc(-11, 13, 5, 0, TAU); c.moveTo(14, 9); c.arc(9, 9, 5, 0, TAU); break;
      case 'chat': rrPath(-21, -17, 42, 28, 10); c.moveTo(-9, 11); c.lineTo(-13, 19); c.lineTo(1, 11); break;
      case 'gear': c.moveTo(9, 0); c.arc(0, 0, 9, 0, TAU); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; c.moveTo(Math.cos(a) * 14, Math.sin(a) * 14); c.lineTo(Math.cos(a) * 20, Math.sin(a) * 20); } break;
      case 'bag': rrPath(-17, -8, 34, 28, 5); c.moveTo(-8, -8); c.arc(0, -8, 8, Math.PI, 0); break;
      case 'photo': rrPath(-20, -16, 40, 32, 6); c.moveTo(-14, 10); c.lineTo(-4, -1); c.lineTo(4, 6); c.lineTo(9, 1); c.lineTo(15, 10); c.moveTo(12, -8); c.arc(9, -8, 3, 0, TAU); break;
      case 'phone': rrPath(-11, -20, 22, 40, 6); c.moveTo(-4, 14); c.lineTo(4, 14); break;
      case 'compass': c.arc(0, 0, 19, 0, TAU); c.moveTo(0, -12); c.lineTo(5, 0); c.lineTo(0, 12); c.lineTo(-5, 0); c.closePath(); break;
      case 'play': rrPath(-20, -16, 40, 32, 8); c.moveTo(-5, -8); c.lineTo(9, 0); c.lineTo(-5, 8); c.closePath(); break;
      case 'book': c.moveTo(0, -10); c.lineTo(0, 16); c.moveTo(0, -10); c.lineTo(-20, -14); c.lineTo(-20, 12); c.lineTo(0, 16); c.lineTo(20, 12); c.lineTo(20, -14); c.closePath(); break;
      case 'search': c.arc(-4, -4, 12, 0, TAU); c.moveTo(5, 5); c.lineTo(17, 17); break;
      case 'bell': c.moveTo(-15, 10); c.quadraticCurveTo(-14, -18, 0, -18); c.quadraticCurveTo(14, -18, 15, 10); c.closePath(); c.moveTo(4, 15); c.arc(0, 15, 4, 0, Math.PI); break;
      case 'chart': c.moveTo(-14, 16); c.lineTo(-14, 4); c.moveTo(0, 16); c.lineTo(0, -12); c.moveTo(14, 16); c.lineTo(14, -2); break;
      case 'lock': rrPath(-15, -4, 30, 24, 5); c.moveTo(-10, -4); c.arc(0, -4, 10, Math.PI, 0); break;
    }
    c.lineWidth = 4.2; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = '#A2A8B2'; c.stroke();
  }
  function stockIcon(g) {               // at the origin, in phone units
    const gr = ctx.createLinearGradient(0, -IS / 2, 0, IS / 2); gr.addColorStop(0, '#3B3F48'); gr.addColorStop(1, '#2A2D34');
    rr(-IS / 2, -IS / 2, IS, IS, 22); ctx.fillStyle = gr; ctx.fill();
    stock(g);
  }
  function drawPhone(t) {
    if (t > 9) return;
    const a = ss(t, .1, 1.1), body = 1 - ss(t, 7.9, 8.9), rise = 30 * (1 - eo(prog(t, .1, 1.3)));
    const Z = Zf(t), u = zoomU(t);
    ctx.save();
    ctx.translate(PIV[0] + (TGT[0] - PIV[0]) * u, PIV[1] + (TGT[1] - PIV[1]) * u + rise); ctx.scale(Z, Z); ctx.translate(-PIV[0], -PIV[1]);
    ctx.globalAlpha = a * body;
    rr(PH.cx - PH.w / 2, PH.cy - PH.h / 2, PH.w, PH.h, PH.r); ctx.fillStyle = '#14171E'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.stroke();
    rr(SX, SY, SW, SHT, PH.r - IN); ctx.fillStyle = '#0C0E13'; ctx.fill();
    // status bar, page dots, dock
    ctx.fillStyle = 'rgba(255,255,255,.26)';
    rr(SX + 40, SY + 36, 64, 15, 7.5); ctx.fill();
    rr(SX + SW - 82, SY + 34, 42, 19, 6); ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(255,255,255,.26)'; ctx.stroke();
    rr(SX + SW - 77, SY + 39, 28, 9, 3); ctx.fill();
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(SX + SW - 116 + i * 12, SY + 43, 3.5, 0, TAU); ctx.fill(); }
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(CX - 16 + i * 16, SY + SHT - 168, 4, 0, TAU); ctx.fillStyle = `rgba(255,255,255,${i ? .14 : .4})`; ctx.fill(); }
    rr(SX + 16, SY + SHT - 140, SW - 32, 120, 42); ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.fill();
    ctx.globalAlpha = 1;
    for (const k of ICONS) {
      const ia = ss(t, .35 + k.i * .03, .8 + k.i * .03) * a;
      if (ia <= 0) continue;
      ctx.globalAlpha = ia;
      if (t < k.ts) { ctx.save(); ctx.translate(k.x, k.y); stockIcon(k.g); ctx.restore(); }
      ctx.globalAlpha = ia * (1 - ss(t, k.ts, k.ts + .25));
      if (!k.dock && t < k.ts + .25) { rr(k.x - k.label / 2, k.y + IS / 2 + 18, k.label, 10, 5); ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fill(); }
    }
    ctx.globalAlpha = 1; ctx.restore();
  }
  // ---------- 2. an app, generated: a prompt, then noise resolving into it, step by step ----------
  const TB = 13.0;                          // the burst, on the seeds' own clock (the film plays it 4s later, at 17s)
  const esine = u => .5 - .5 * Math.cos(Math.PI * u);
  const FC = [540, 720], SEEDPT = IMPACT;   // the cloud comes out of the sparkle
  // the app it generates: a squircle tile, its outline in Sea glass, its features forming inside
  const GEN = [], AH = 210;
  const sq = th => { const c = Math.cos(th), s2 = Math.sin(th); return [Math.sign(c) * Math.pow(Math.abs(c), .5) * AH, Math.sign(s2) * Math.pow(Math.abs(s2), .5) * AH]; };
  const byX = x => clamp(Math.floor((x + AH) / (2 * AH) * 4), 0, 3);
  { // the outline, evenly spaced along its length
    const ND = 40000, dense = Array.from({ length: ND }, (_, i) => sq(i / ND * TAU)), cum = [0];
    for (let i = 1; i <= ND; i++) { const p0 = dense[i - 1], p1 = dense[i % ND]; cum.push(cum[i - 1] + Math.hypot(p1[0] - p0[0], p1[1] - p0[1])); }
    let j = 0;
    for (let i = 0; i < 320; i++) { const L = i / 320 * cum[ND]; while (cum[j + 1] < L) j++; const [x, y] = dense[j]; GEN.push({ x: FC[0] + x, y: FC[1] + y, c: byX(x), sz: 1 }); }
  }
  for (let i = 0; i < 260; i++) {
    let x, y; do { x = (rnd() * 2 - 1) * AH; y = (rnd() * 2 - 1) * AH; } while (Math.pow(Math.abs(x / AH), 4) + Math.pow(Math.abs(y / AH), 4) > .82);
    GEN.push({ x: FC[0] + x, y: FC[1] + y, c: byX(x), sz: .6, al: .45 });
  }
  for (let i = 0; i < 90; i++) { const a = i / 90 * TAU; GEN.push({ x: FC[0] - 80 + Math.cos(a) * 62, y: FC[1] - 60 + Math.sin(a) * 62, w: 1, sz: 1 }); }
  [44, 70, 56, 90].forEach((h, j) => { for (let i = 0; i < 18; i++) GEN.push({ x: FC[0] + 46 + j * 34, y: FC[1] - 10 - i / 17 * h, w: 1, sz: 1.1 }); });
  [[64, 280], [118, 200]].forEach(([y, len]) => {
    for (let i = 0; i < 50; i++) GEN.push({ x: FC[0] - 110 + i / 49 * len, y: FC[1] + y, w: 1, sz: 1 });
    for (let i = 0; i < 12; i++) { const a = i / 12 * TAU; GEN.push({ x: FC[0] - 140 + Math.cos(a) * 8, y: FC[1] + y + Math.sin(a) * 8, w: 1, sz: .9 }); }
  });
  GEN.forEach((p, k) => { p.k = k; p.sx = 140 + rnd() * 800; p.sy = 560 + rnd() * 720; p.ph = rnd() * TAU; });
  const PROMPT = '> Apps that do what you need to do';
  function drawGen(t) {
    if (t < 10.8 || t > 20.5) return;
    const pa = ss(t, 10.8, 11.0) * (1 - ss(t, 16.2, 16.8));
    if (pa > 0) {                                          // what the person asks for
      ctx.font = `500 40px ${MONO}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; if (HAS_LS) ctx.letterSpacing = '0px';
      const n = Math.round(PROMPT.length * prog(t, 10.9, 12.0)), x0 = CX - ctx.measureText(PROMPT).width / 2, typed = PROMPT.slice(0, n);

      const a0 = Math.atan2(q.sy - FPC[1], q.sx - FPC[0]), r0 = Math.hypot(q.sx - FPC[0], q.sy - FPC[1]);
      const a1 = Math.atan2(ty - FPC[1], tx - FPC[0]), r1 = Math.hypot(tx - FPC[0], ty - FPC[1]);
      let da = a1 - a0; while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU;
      const ang = a0 + da * land + (1 - land) * land * 2.4, rad = lerp(r0, r1, land);
      let x = FPC[0] + Math.cos(ang) * rad, y = FPC[1] + Math.sin(ang) * rad;
      x = lerp(x, q.sx, out); y = lerp(y, q.sy, out);
      const al = ss(t, 29.3, 29.7) * (1 - out), sz = 24 * (1 - .4 * out);
      if (al <= 0) continue;
      ctx.globalAlpha = al; rr(x - sz / 2, y - sz / 2, sz, sz, 7); ctx.fillStyle = rgba(mix(tileCol(q.p[0]), tileCol(q.p[1]), q.d)); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // front and center
    const ca = ss(t, 30.9, 31.6) * (1 - out); if (ca <= 0) return;
    const fl = pi === 0 ? 1 : prog(t, FWIN[pi] + .3, FWIN[pi] + .7), id = pi === 0 || fl >= .5 ? CORE[pi] : CORE[prv], app = APPS[id];
    const pulse = (t * .8) % 1;
    ctx.beginPath(); ctx.arc(FPC[0], FPC[1], 95 + 70 * pulse, 0, TAU); ctx.lineWidth = 3; ctx.strokeStyle = rgba(pal(1), .5 * ca * (1 - pulse)); ctx.stroke();
    glow(FPC[0], FPC[1], 200, DARK[app.p[0]], .4 * ca);
    ctx.save(); ctx.translate(FPC[0], FPC[1]); ctx.scale(eback(prog(t, 30.9, 31.6)) * (pi === 0 ? 1 : Math.max(.001, Math.abs(Math.cos(fl * Math.PI)))), eback(prog(t, 30.9, 31.6))); ctx.globalAlpha = ca;
    const gr = ctx.createLinearGradient(-75, -75, 75, 75); gr.addColorStop(0, rgba(tileCol(app.p[0]))); gr.addColorStop(1, rgba(tileCol(app.p[1])));
    rr(-75, -75, 150, 150, 38); ctx.fillStyle = gr; ctx.fill();
    ctx.scale(1.9, 1.9); glyph(app.g);
    ctx.restore(); ctx.globalAlpha = 1;
  }
  const drawUnique = t => VARIANT === 'print' ? drawPrint(t) : drawHero(t);

  // ---------- the words ----------
  const BEATS = [
    { a: 1.3, b: 5.0, lines: ['Someone else decided', 'what your apps can do.'], dim: .86 },
    { a: 9.0, b: 11.8, lines: ['Not *anymore.*'] },
    { a: 17.5, b: 20.2, lines: ['Built from the *ground up.*'] },
    { a: 20.8, b: 23.4, lines: ['Shaped by *you.*'] },
    { a: 24.1, b: 27.0, lines: ['Custom to *you*', "and your *family's needs.*"] },
    { a: 30.2, b: 33.6, lines: ['*AllisonOS* customizes your apps', 'so what matters most', 'is *front and center.*'] },
    { a: 33.9, b: 36.2, lines: ['No two are *alike.*'] },
    { a: 38.3, b: 40.5, fold: 39.6, lines: ['Declare your', '*independence.*'] },
    { a: 43.05, b: 99, lines: ['Break free'], y: [MK.BY + 192], size: 76 },
    { a: 43.4, b: 99, lines: ['Coming soon'], y: [MK.BY + 262], size: 40, weight: 500, dim: .58 },
  ];
  const segs = s => s.split(/(\*[^*]+\*)/).filter(Boolean).map(p => p[0] === '*' ? { t: p.slice(1, -1), p: 1 } : { t: p });
  function drawWords(t) {
    for (const bt of BEATS) {
      if (t < bt.a || t > bt.b) continue;
      let size = bt.size || 80; const weight = bt.weight || 700;
      const n = bt.lines.length, ys = bt.y || (n === 3 ? [1500, 1594, 1688] : n === 2 ? [1556, 1652] : [1604]);
      const setFont = () => { ctx.font = `${weight} ${size}px ${FAM}`; if (HAS_LS) ctx.letterSpacing = (-.014 * size).toFixed(2) + 'px'; };
      setFont(); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      const widest = Math.max(...bt.lines.map(l => ctx.measureText(l.replace(/\*/g, '')).width));
      if (widest > 940) { size = Math.floor(size * 940 / widest); setFont(); }   // fit the phone
      bt.lines.forEach((line, li) => {
        const tin = bt.a + li * .12;
        const out = bt.fold ? 0 : ss(t, bt.b - .45, bt.b);
        const al = ss(t, tin, tin + .55) * (1 - out) * (bt.dim || 1);
        if (al <= 0) return;
        const dy = 26 * (1 - eo(prog(t, tin, tin + .75))) - 14 * out;
        const sg = segs(line), ws = sg.map(s => ctx.measureText(s.t).width);
        let x = CX - ws.reduce((a, b) => a + b, 0) / 2;
        ctx.save();
        if (bt.fold && t > bt.fold) {                            // shrink up into the name, and fold
          const u = eio(prog(t, bt.fold + li * .06, 40.3)), pf = prog(t, 40.3, 40.5), my = ys[li] - size * .36;
          ctx.translate(lerp(CX, MK.T[0], u), lerp(my, MK.T[1], u));
          const sc = lerp(1, .2, u); ctx.scale(sc * Math.max(.001, Math.cos(pf * Math.PI / 2)), sc);
          ctx.translate(-CX, -my);
        }
        ctx.globalAlpha = al;
        sg.forEach((s, i) => { ctx.fillStyle = s.p ? pastel(x, x + ws[i], t) : rgba(ink(t)); ctx.fillText(s.t, x, ys[li] + dy); x += ws[i]; });
        ctx.restore();
      });
    }
    if (HAS_LS) ctx.letterSpacing = '0px';
  }

  // ---------- one frame ----------
  function render(t) {
    t = clamp(t, 0, DUR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.globalAlpha = 1;
    const [top, bot] = sky(t);
    const g = ctx.createLinearGradient(0, 0, 0, CH); g.addColorStop(0, rgba(top)); g.addColorStop(1, rgba(bot));
    ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
    ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, DPR * OY);
    NOW = t;
    // the family phones, the seeds and the name fold keep their own clocks: shifted to make room for the new scenes
    const tf = t < 29.19 ? t - 4 : t < 39.5 ? 25.19 : t - 14.31;
    drawMist(t); drawPhone(t); drawAbsorb(t); drawGen(t);
    drawFamily(tf, famA(t)); drawUnique(t); drawSeeds(t - 4); drawMark(t - 14.3); drawWords(t);
    document.body.style.background = rgba(bot);
  }

  // ---------- playback ----------
  const bar = document.getElementById('progress'), pill = document.getElementById('pill');
  let t0 = 0, held = 0, playing = false, raf = 0;
  const now = () => performance.now() / 1000;
  function tick() {
    const t = now() - t0;
    render(t); bar.style.transform = `scaleX(${clamp(t / DUR)})`;
    if (t >= DUR) { playing = false; held = DUR; pill.textContent = 'Replay'; pill.hidden = false; return; }
    raf = requestAnimationFrame(tick);
  }
  function play(from = 0) { cancelAnimationFrame(raf); t0 = now() - from; playing = true; pill.hidden = true; raf = requestAnimationFrame(tick); }
  function pause() { if (!playing) return; cancelAnimationFrame(raf); held = now() - t0; playing = false; pill.textContent = 'Play'; pill.hidden = false; }
  pill.addEventListener('click', e => { e.stopPropagation(); play(pill.textContent === 'Play' ? held : 0); });
  cv.addEventListener('click', () => { if (playing) pause(); else if (pill.textContent === 'Play') play(held); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('resize', () => { resize(); if (!playing) render(held); });

  async function start() {
    resize();
    try {
      await Promise.race([
        Promise.all(['500 40px Inter', '700 80px Inter', '800 260px Inter', '500 52px "JetBrains Mono"'].map(f => document.fonts.load(f, 'aOS1 Break free {}'))),
        new Promise(r => setTimeout(r, 2500)),
      ]);
    } catch (e) { /* the system font stack still draws */ }
    layoutMark(); layoutLine();
    if (EXPORT) { window.renderAt = render; render(0); window.__ready = true; return; }
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { held = DUR; render(DUR); pill.textContent = 'Replay'; pill.hidden = false; return; }
    play(0);
  }
  start();
})();
</script>
